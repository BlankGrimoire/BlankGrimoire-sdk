name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      - name: Check generated schema is up to date
        run: pnpm schema:check

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp packages/runtime/dist/runtime.js release/runtime.js
          cp schema/v1.json release/schema-v1.json
          tar -czf release/fixtures-v1.tar.gz -C fixtures v1

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIT_AUTHOR_NAME: BlankGrimoire contributors
          GIT_AUTHOR_EMAIL: blankgrimoire.dev@gmail.com
          GIT_COMMITTER_NAME: BlankGrimoire contributors
          GIT_COMMITTER_EMAIL: blankgrimoire.dev@gmail.com
          # NPM_TOKEN: ${{ secrets.NPM_TOKEN }} # enable with SDK-6 publishing
        run: >-
          npx --yes
          -p semantic-release@24
          -p @semantic-release/changelog@6
          -p @semantic-release/exec@6
          -p conventional-changelog-conventionalcommits@8
          semantic-release
