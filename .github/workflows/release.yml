name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Create GitHub App token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: BlankGrimoire
          repositories: BlankGrimoire-sdk

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.5.1 && npm --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      - name: Check generated schema is up to date
        run: pnpm schema:check

      - name: Build and verify release assets
        run: pnpm release:assets

      - name: Verify package manifests before publishing
        run: PUBLISH_DRY_RUN=1 bash scripts/publish-packages.sh

      - name: Run semantic-release
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
          GIT_AUTHOR_NAME: BlankGrimoire contributors
          GIT_AUTHOR_EMAIL: blankgrimoire.dev@gmail.com
          GIT_COMMITTER_NAME: BlankGrimoire contributors
          GIT_COMMITTER_EMAIL: blankgrimoire.dev@gmail.com
          NPM_CONFIG_LOGLEVEL: verbose
        run: pnpm exec semantic-release
