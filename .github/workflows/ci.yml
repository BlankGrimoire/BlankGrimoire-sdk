name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      - name: Check generated schema is up to date
        run: pnpm schema:check

      - name: Build and verify release assets
        run: pnpm release:assets

      - name: Verify package manifests before publishing
        run: PUBLISH_DRY_RUN=1 bash scripts/publish-packages.sh

      - name: Smoke-test the CLI binary
        run: node packages/cli/dist/cli.js --help
